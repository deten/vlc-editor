# Builds and tests all packages.
name: Build and test

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-14, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-intel }
          - { os: ubuntu-22.04, platform: linux-x86_64 }   # oldest glibc, so it runs on newer systems
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VLC
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco install vlc -y --no-progress ;;
            macOS)   brew install --cask vlc ;;
            Linux)   sudo apt-get update && sudo apt-get install -y vlc libegl1 libxkbcommon0 ;;
          esac

      - name: Python environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Self-test the packaged app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) app="build/VLC-Editor/app/VLC Editor.exe" ;;
            macOS)   app="build/pyinstaller/dist/VLC Editor.app/Contents/MacOS/VLC Editor" ;;
            Linux)   app="build/pyinstaller/dist/vlc-editor/vlc-editor" ;;
          esac
          status=0
          "$app" --selftest selftest.txt || status=$?
          cat selftest.txt
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  linux-check:
    name: Check Linux package on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            setup: |
              dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
              dnf swap -y ffmpeg-free ffmpeg --allowerasing
              dnf install -y vlc vlc-plugins-freeworld mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs tar gzip
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y vlc libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install VLC
        run: ${{ matrix.setup }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Install and self-test
        shell: bash
        run: |
          tar -xzf dist/*.tar.gz -C /tmp
          /tmp/vlc-editor/install.sh
          test -f ~/.local/share/vlc/lua/extensions/vlc_editor.lua
          status=0
          ~/.local/share/vlc-editor/vlc-editor --selftest /tmp/selftest.txt || status=$?
          cat /tmp/selftest.txt
          exit $status
